[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-signature-phase0"
version = "0.1.0"
description = "Falsifiable Phase-0 experiment for signatures of neural optimization trajectories"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1",
  "PyYAML>=6",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "tabulate>=0.9",
  "torch>=2.2",
  "torchvision>=0.17",
  "esig>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
trajsig = "trajsig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
